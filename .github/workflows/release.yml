name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing fork tag to release, for example v1.10.2-0
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: build-and-release
  queue: max

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Reject release rollback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Repository release order is the numeric core version followed by an
          # optional numeric fork revision (vX.Y.Z-N). This avoids lexical and
          # SemVer prerelease ordering from rolling the fork stream backward.
          parse_release_tag() {
            local tag="$1"
            local has_fork_revision=0
            local fork_revision=0
            if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)))?$ ]]; then
              return 1
            fi
            if [ -n "${BASH_REMATCH[5]}" ]; then
              has_fork_revision=1
              fork_revision="${BASH_REMATCH[5]}"
            fi
            printf '%s %s %s %s %s\n' \
              "${BASH_REMATCH[1]}" \
              "${BASH_REMATCH[2]}" \
              "${BASH_REMATCH[3]}" \
              "${has_fork_revision}" \
              "${fork_revision}"
          }

          compare_release_tags() {
            local left="$1"
            local right="$2"
            local left_parts right_parts index

            left_parts="$(parse_release_tag "${left}")" || return 2
            right_parts="$(parse_release_tag "${right}")" || return 2
            read -r -a left_parts <<< "${left_parts}"
            read -r -a right_parts <<< "${right_parts}"

            for index in 0 1 2 3 4; do
              if (( ${#left_parts[index]} < ${#right_parts[index]} )); then
                return 1
              fi
              if (( ${#left_parts[index]} > ${#right_parts[index]} )); then
                return 0
              fi
              if [[ "${left_parts[index]}" < "${right_parts[index]}" ]]; then
                return 1
              fi
              if [[ "${left_parts[index]}" > "${right_parts[index]}" ]]; then
                return 0
              fi
            done
            return 0
          }

          if ! parse_release_tag "${RELEASE_TAG}" >/dev/null; then
            echo "[!] Release tag must match vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-FORK_REVISION: ${RELEASE_TAG}"
            exit 1
          fi

          latest_tag="$(gh release list --limit 1000 --json tagName,isLatest --jq '
            if length == 0 then
              ""
            else
              ([.[] | select(.isLatest == true) | .tagName] |
                if length == 1 then
                  .[0]
                elif length == 0 then
                  error("release history exists but none is marked latest")
                else
                  error("multiple releases are marked latest")
                end)
            end
          ')"
          if [ -z "${latest_tag}" ]; then
            echo "[i] No current latest release; ${RELEASE_TAG} may become latest."
            exit 0
          fi
          if ! parse_release_tag "${latest_tag}" >/dev/null; then
            echo "[!] Cannot safely compare current latest release tag: ${latest_tag}"
            exit 1
          fi
          if ! compare_release_tags "${RELEASE_TAG}" "${latest_tag}"; then
            echo "[!] Refusing to release ${RELEASE_TAG}: current latest is newer (${latest_tag})."
            exit 1
          fi
          echo "[i] Release order check passed: ${RELEASE_TAG} >= ${latest_tag}."

      - name: Build all-in-one HTML
        run: bun run build
        env:
          VERSION: ${{ env.RELEASE_TAG }}

      - name: Prepare release assets
        run: |
          cd dist
          mv index.html management.html
          ls -lh management.html

      - name: Generate release notes
        run: |
          set -euo pipefail
          current_tag="${RELEASE_TAG}"
          previous_tag="$(git tag --list 'v*' --sort=-v:refname | grep -v "^${current_tag}$" | head -n 1 || true)"
          if [ -n "${previous_tag}" ]; then
            range="${previous_tag}..${current_tag}"
          else
            range="${current_tag}"
          fi

          : > release-notes.md
          git log --pretty=format:"- %h %s" "${range}" >> release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/management.html
          body_path: release-notes.md
          draft: false
          prerelease: false
          make_latest: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
